name: Build V0.17 APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-v017.yml'
      - 'MainActivity_V0.17.kt'
      - 'app-build-v017.gradle'
      - 'PdfToEpub_V0.15_CONTEXTUAL_SPATIAL_RECONSTRUCTION.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify V0.17 inputs
        run: |
          set -e
          test -s MainActivity_V0.17.kt
          test -s app-build-v017.gradle
          test -s PdfToEpub_V0.15_CONTEXTUAL_SPATIAL_RECONSTRUCTION.zip
          grep -q 'V0.17' MainActivity_V0.17.kt
          grep -q "versionCode 17" app-build-v017.gradle
          grep -q "versionName '0.17'" app-build-v017.gradle
          grep -q 'detectIntentionalWhitespace' MainActivity_V0.17.kt
          echo "V0.17 inputs verified."

      - name: Extract V0.15 build baseline
        run: |
          set -e
          rm -rf v017
          mkdir v017
          unzip -q PdfToEpub_V0.15_CONTEXTUAL_SPATIAL_RECONSTRUCTION.zip -d v017
          test -f v017/settings.gradle
          test -f v017/build.gradle
          test -f v017/app/build.gradle
          test -f v017/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt

      - name: Apply V0.17 source
        run: |
          set -e
          cp MainActivity_V0.17.kt v017/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt
          cp app-build-v017.gradle v017/app/build.gradle

      - name: Verify applied V0.17 project
        run: |
          set -e
          grep -q 'V0.17' v017/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt
          grep -q "versionCode 17" v017/app/build.gradle
          grep -q "versionName '0.17'" v017/app/build.gradle
          grep -q 'detectIntentionalWhitespace' v017/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt
          grep -q 'pageNumber: Int = 0' v017/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt
          echo "Applied V0.17 source verified."

      - name: Build V0.17 APK
        working-directory: v017
        run: gradle clean assembleDebug --no-daemon

      - name: Verify actual APK
        run: |
          set -e
          APK="v017/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"
          echo "ACTUAL APK BUILD VERIFIED."

      - name: Upload V0.17 APK
        uses: actions/upload-artifact@v4
        with:
          name: PdfToEpub_V0.17_debug
          path: v017/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
