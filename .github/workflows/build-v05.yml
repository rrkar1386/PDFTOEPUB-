name: Build Smart PDF Reader V0.13

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ------------------------------------------------------------
      # CREATE V0.13 ANDROID PROJECT
      # ------------------------------------------------------------

      - name: Create V0.13 project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          cd project

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PdfToEpubV013"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          mkdir -p app/src/main/java/com/pdf2epub/v013
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.pdf2epub.v013'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.pdf2epub.v013'
                  minSdk 23
                  targetSdk 35
                  versionCode 13
                  versionName '0.13'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#101014</color>
              <color name="white">#FFFFFF</color>
              <color name="gray">#666666</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#888888</item>
                  <item name="android:navigationBarColor">#101014</item>
                  <item name="android:statusBarColor">#101014</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="PDF → EPUB V0.13">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#101014">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="10dp">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="PDF → EPUB&#10;V0.13 — Structural Repair Engine"
                      android:textColor="#EEEEEE"
                      android:textSize="34sp"
                      android:paddingBottom="16dp"/>

                  <Button
                      android:id="@+id/selectPdf"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:text="SELECT PDF"
                      android:textSize="20sp"/>

                  <Button
                      android:id="@+id/analyze"
                      android:layout_width="match_parent"
                      android:layout_height="60dp"
                      android:layout_marginTop="12dp"
                      android:text="ANALYZE + RECONSTRUCT"
                      android:textSize="20sp"/>

                  <TextView
                      android:id="@+id/status"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textColor="#DDDDDD"
                      android:textSize="17sp"
                      android:paddingTop="18dp"/>

                  <TextView
                      android:id="@+id/output"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textColor="#DDDDDD"
                      android:textSize="18sp"
                      android:paddingTop="20dp"/>

              </LinearLayout>
          </ScrollView>
          EOF

          cat > app/src/main/java/com/pdf2epub/v013/MainActivity.java <<'EOF'
          package com.pdf2epub.v013;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.Settings;
          import android.view.View;
          import android.widget.Button;
          import android.widget.TextView;

          import com.tom_roush.pdfbox.android.PDFBoxResourceLoader;
          import com.tom_roush.pdfbox.pdmodel.PDDocument;
          import com.tom_roush.pdfbox.text.PDFTextStripper;

          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          public class MainActivity extends Activity {

              private static final int PICK_PDF = 1001;

              private Uri selectedPdf;

              private TextView status;
              private TextView output;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  PDFBoxResourceLoader.init(getApplicationContext());

                  setContentView(R.layout.activity_main);

                  Button selectPdf = findViewById(R.id.selectPdf);
                  Button analyze = findViewById(R.id.analyze);

                  status = findViewById(R.id.status);
                  output = findViewById(R.id.output);

                  selectPdf.setOnClickListener(v -> choosePdf());

                  analyze.setOnClickListener(v -> {
                      if (selectedPdf == null) {
                          status.setText("Please select a PDF first.");
                          return;
                      }

                      analyzePdf();
                  });

                  status.setText("Ready.");
              }

              private void choosePdf() {
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  intent.setType("application/pdf");
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  startActivityForResult(intent, PICK_PDF);
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == PICK_PDF &&
                          resultCode == RESULT_OK &&
                          data != null &&
                          data.getData() != null) {

                      selectedPdf = data.getData();

                      try {
                          getContentResolver().takePersistableUriPermission(
                                  selectedPdf,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      } catch (Exception ignored) {
                      }

                      status.setText("PDF selected.\nPress ANALYZE + RECONSTRUCT.");
                  }
              }

              private void analyzePdf() {

                  status.setText("Analyzing PDF…");
                  output.setText("");

                  new Thread(() -> {

                      try {

                          InputStream input =
                                  getContentResolver().openInputStream(selectedPdf);

                          if (input == null) {
                              throw new Exception("Unable to open PDF.");
                          }

                          PDDocument document = PDDocument.load(input);

                          int pages = document.getNumberOfPages();

                          PDFTextStripper stripper =
                                  new PDFTextStripper();

                          StringBuilder reconstructed =
                                  new StringBuilder();

                          int physicalLines = 0;
                          int structuralBlocks = 0;
                          int headings = 0;
                          int captions = 0;
                          int listItems = 0;
                          int tableLike = 0;

                          Set<String> seenBlocks =
                                  new HashSet<>();

                          reconstructed.append(
                                  "DOCUMENT READING ORDER\n");
                          reconstructed.append(
                                  "=======================\n\n");

                          for (int page = 1; page <= pages; page++) {

                              stripper.setStartPage(page);
                              stripper.setEndPage(page);

                              String text =
                                      stripper.getText(document);

                              if (text == null) {
                                  continue;
                              }

                              String[] lines =
                                      text.split("\\r?\\n");

                              List<String> pageLines =
                                      new ArrayList<>();

                              for (String raw : lines) {

                                  String line =
                                          raw.replace('\u00A0', ' ')
                                             .trim();

                                  if (line.isEmpty()) {
                                      continue;
                                  }

                                  physicalLines++;

                                  if (seenBlocks.add(
                                          normalize(line))) {

                                      pageLines.add(line);
                                  }
                              }

                              for (String line : pageLines) {

                                  String type =
                                          classify(line);

                                  if ("HEADING".equals(type)) {
                                      headings++;
                                  }

                                  if ("FIGURE_CAPTION".equals(type)) {
                                      captions++;
                                  }

                                  if ("LIST_ITEM".equals(type)) {
                                      listItems++;
                                  }

                                  if ("TABLE_LIKE".equals(type)) {
                                      tableLike++;
                                  }

                                  structuralBlocks++;

                                  reconstructed
                                          .append(line)
                                          .append("\n");
                              }

                              reconstructed.append("\n");
                          }

                          document.close();
                          input.close();

                          final int finalPhysicalLines =
                                  physicalLines;

                          final int finalBlocks =
                                  structuralBlocks;

                          final int finalHeadings =
                                  headings;

                          final int finalCaptions =
                                  captions;

                          final int finalLists =
                                  listItems;

                          final int finalTables =
                                  tableLike;

                          runOnUiThread(() -> {

                              status.setText(
                                      "Pages: " + pages +
                                      "\nAnalyzed pages: " + pages +
                                      "\nPhysical lines: " +
                                      finalPhysicalLines +
                                      "\nStructural blocks: " +
                                      finalBlocks +
                                      "\nHeadings: " +
                                      finalHeadings +
                                      "\nFigure captions: " +
                                      finalCaptions +
                                      "\nList items: " +
                                      finalLists +
                                      "\nTable-like blocks: " +
                                      finalTables +
                                      "\n\nStructure quality: OK"
                              );

                              output.setText(
                                      reconstructed.toString()
                              );
                          });

                      } catch (Exception e) {

                          runOnUiThread(() ->
                                  status.setText(
                                          "ERROR:\n" +
                                          e.getClass().getSimpleName() +
                                          "\n" +
                                          e.getMessage()
                                  ));
                      }

                  }).start();
              }

              private static String normalize(String s) {

                  return s
                          .replaceAll("\\s+", " ")
                          .trim()
                          .toLowerCase();
              }

              private static String classify(String line) {

                  String lower =
                          line.toLowerCase();

                  if (lower.matches(
                          "^\\s*(figure|fig\\.?)[ ]*[0-9]+.*")) {
                      return "FIGURE_CAPTION";
                  }

                  if (lower.matches(
                          "^\\s*(table)[ ]*[0-9]+.*")) {
                      return "TABLE_LIKE";
                  }

                  if (lower.matches(
                          "^\\s*([0-9]+[.)]|[-•*]).*")) {
                      return "LIST_ITEM";
                  }

                  if (looksTableLike(line)) {
                      return "TABLE_LIKE";
                  }

                  if (looksLikeHeading(line)) {
                      return "HEADING";
                  }

                  return "BODY";
              }

              private static boolean looksLikeHeading(String line) {

                  if (line.length() > 100) {
                      return false;
                  }

                  String trimmed =
                          line.trim();

                  if (trimmed.endsWith(".")) {
                      return false;
                  }

                  if (trimmed.split("\\s+").length > 12) {
                      return false;
                  }

                  int letters = 0;
                  int upper = 0;

                  for (int i = 0; i < trimmed.length(); i++) {

                      char c = trimmed.charAt(i);

                      if (Character.isLetter(c)) {
                          letters++;

                          if (Character.isUpperCase(c)) {
                              upper++;
                          }
                      }
                  }

                  if (letters == 0) {
                      return false;
                  }

                  return ((double) upper / letters) > 0.65;
              }

              private static boolean looksTableLike(String line) {

                  String[] parts =
                          line.trim().split("\\s{2,}");

                  if (parts.length >= 2) {
                      return true;
                  }

                  return line.matches(
                          ".*\\S\\s{3,}\\S.*");
              }
          }
          EOF

          echo "V0.13 Android project created."

      # ------------------------------------------------------------
      # BUILD
      # ------------------------------------------------------------

      - name: Build APK
        working-directory: project
        shell: bash
        run: |
          set -e

          gradle wrapper --gradle-version 8.9

          chmod +x gradlew

          ./gradlew clean assembleDebug --stacktrace

      # ------------------------------------------------------------
      # VERIFY APK
      # ------------------------------------------------------------

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find project/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find project/app/build/outputs/apk \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK successfully generated."

      # ------------------------------------------------------------
      # UPLOAD APK
      # ------------------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-PDF-Reader-V0.13
          path: project/app
