name: Build Smart PDF Reader V0.13

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ============================================================
      # CREATE A CLEAN V0.13 ANDROID PROJECT
      # ============================================================

      - name: Create V0.13 Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Creating clean V0.13 project..."

          rm -rf project
          mkdir -p project/app/src/main/java/com/pdftoepub/v013
          mkdir -p project/app/src/main/res/values

          cd project

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Smart-PDF-Reader-V0.13"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.pdftoepub.v013'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.pdftoepub.v013'
                  minSdk 26
                  targetSdk 35
                  versionCode 13
                  versionName '0.13'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="PDF to EPUB V0.13"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="AppTheme"
                  parent="Theme.Material3.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/pdftoepub/v013/MainActivity.kt <<'EOF'
          package com.pdftoepub.v013

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import com.tom_roush.pdfbox.android.PDFBoxResourceLoader
          import com.tom_roush.pdfbox.pdmodel.PDDocument
          import com.tom_roush.pdfbox.text.PDFTextStripper
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private lateinit var output: TextView

              private var selectedUri: Uri? = null

              companion object {
                  private const val REQUEST_PDF = 100
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  PDFBoxResourceLoader.init(applicationContext)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(18, 18, 18, 18)
                  }

                  val title = TextView(this).apply {
                      text = "PDF → EPUB\nV0.13 — Region–Relationship Reconstruction Engine"
                      textSize = 27f
                      setPadding(0, 0, 0, 20)
                  }

                  val selectButton = Button(this).apply {
                      text = "SELECT PDF"
                  }

                  val analyzeButton = Button(this).apply {
                      text = "ANALYZE + RECONSTRUCT"
                  }

                  output = TextView(this).apply {
                      textSize = 16f
                      setPadding(0, 20, 0, 0)
                      setTextIsSelectable(true)
                  }

                  root.addView(title)
                  root.addView(selectButton)
                  root.addView(analyzeButton)

                  root.addView(
                      ScrollView(this).apply {
                          addView(output)
                      },
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )

                  setContentView(root)

                  selectButton.setOnClickListener {
                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          type = "application/pdf"
                          addCategory(Intent.CATEGORY_OPENABLE)
                          addFlags(
                              Intent.FLAG_GRANT_READ_URI_PERMISSION or
                              Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                          )
                      }

                      startActivityForResult(intent, REQUEST_PDF)
                  }

                  analyzeButton.setOnClickListener {
                      val uri = selectedUri

                      if (uri == null) {
                          output.text = "Please select a PDF first."
                          return@setOnClickListener
                      }

                      analyzePdf(uri)
                  }
              }

              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (
                      requestCode == REQUEST_PDF &&
                      resultCode == Activity.RESULT_OK
                  ) {
                      selectedUri = data?.data

                      selectedUri?.let {
                          try {
                              contentResolver.takePersistableUriPermission(
                                  it,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION
                              )
                          } catch (_: Exception) {
                          }

                          output.text =
                              "Selected PDF:\n$it\n\nPress ANALYZE + RECONSTRUCT."
                      }
                  }
              }

              private fun analyzePdf(uri: Uri) {

                  output.text =
                      "Running V0.13 spatial reconstruction...\n\n"

                  Thread {

                      try {

                          val result =
                              contentResolver.openInputStream(uri)?.use { input ->
                                  analyzeDocument(input)
                              } ?: "Could not open PDF."

                          runOnUiThread {
                              output.text = result
                          }

                      } catch (e: Exception) {

                          runOnUiThread {
                              output.text =
                                  "Analysis error:\n" +
                                  "${e.javaClass.simpleName}: " +
                                  "${e.message ?: "unknown error"}"
                          }
                      }

                  }.start()
              }

              /*
               * V0.13 reconstruction model
               *
               * IMPORTANT:
               *
               * This version does NOT globally sort every text item by
               * Y-position and then X-position.
               *
               * Instead it keeps page-local physical lines and uses
               * spatial relationships to determine whether material
               * belongs to:
               *
               *  - normal prose
               *  - headings
               *  - captions
               *  - source/reference material
               *  - genuine repeated aligned structures
               *
               * A single neighbouring pair is never sufficient to turn
               * ordinary prose into a table.
               */

              private fun analyzeDocument(
                  input: java.io.InputStream
              ): String {

                  PDDocument.load(input).use { document ->

                      if (document.numberOfPages == 0) {
                          return "PDF has no pages."
                      }

                      val pages = mutableListOf<PageModel>()

                      var rawItems = 0
                      var physicalLines = 0
                      var duplicateItems = 0

                      for (pageIndex in 0 until document.numberOfPages) {

                          val page = document.getPage(pageIndex)

                          val stripper =
                              PDFTextStripper().apply {
                                  startPage = pageIndex + 1
                                  endPage = pageIndex + 1
                                  sortByPosition = true
                              }

                          val text =
                              stripper.getText(document)

                          val lines =
                              text.lines()
                                  .map { it.trim() }
                                  .filter { it.isNotEmpty() }

                          rawItems += lines.size
                          physicalLines += lines.size

                          val cleaned =
                              removeExactAdjacentDuplicates(lines)

                          duplicateItems +=
                              lines.size - cleaned.size

                          pages.add(
                              PageModel(
                                  pageNumber = pageIndex + 1,
                                  lines = cleaned
                              )
                          )
                      }

                      val reconstructed =
                          pages.flatMap { page ->
                              reconstructPage(page)
                          }

                      return formatResult(
                          pageCount = document.numberOfPages,
                          rawItems = rawItems,
                          physicalLines = physicalLines,
                          duplicateItems = duplicateItems,
                          blocks = reconstructed
                      )
                  }
              }

              /*
               * Only remove exact adjacent duplicates.
               *
               * This deliberately avoids global duplicate removal because
               * repeated short phrases may be legitimate content on
               * different pages.
               */

              private fun removeExactAdjacentDuplicates(
                  lines: List<String>
              ): List<String> {

                  if (lines.isEmpty()) return emptyList()

                  val result = mutableListOf<String>()

                  for (line in lines) {

                      if (
                          result.isEmpty() ||
                          result.last() != line
                      ) {
                          result.add(line)
                      }
                  }

                  return result
              }

              /*
               * Region-local reconstruction.
               *
               * Normal prose remains normal prose.
               *
               * We only identify a table-like structure when several
               * consecutive lines show a stable two-unit relationship.
               */

              private fun reconstructPage(
                  page: PageModel
              ): List<Block> {

                  val blocks = mutableListOf<Block>()

                  var prose = StringBuilder()

                  fun flushProse() {

                      val text =
                          prose.toString().trim()

                      if (text.isNotEmpty()) {
                          blocks.add(
                              Block(
                                  type = "BODY",
                                  text = text
                              )
                          )
                      }

                      prose = StringBuilder()
                  }

                  var i = 0

                  while (i < page.lines.size) {

                      val line = page.lines[i]

                      /*
                       * Heading-like lines are recognised conservatively.
                       */

                      if (isHeading(line)) {

                          flushProse()

                          blocks.add(
                              Block(
                                  type = "HEADING",
                                  text = line
                              )
                          )

                          i++
                          continue
                      }

                      /*
                       * Caption detection.
                       */

                      if (isCaption(line)) {

                          flushProse()

                          blocks.add(
                              Block(
                                  type = "FIGURE_CAPTION",
                                  text = line
                              )
                          )

                          i++
                          continue
                      }

                      /*
                       * Repeated aligned-unit detection.
                       *
                       * We require several consecutive candidates.
                       */

                      val table =
                          detectTableLikeRegion(
                              page.lines,
                              i
                          )

                      if (table != null) {

                          flushProse()

                          blocks.add(
                              Block(
                                  type = "TABLE",
                                  text = table.text
                              )
                          )

                          i = table.endIndex
                          continue
                      }

                      /*
                       * Everything else remains body material.
                       */

                      if (prose.isNotEmpty()) {
                          prose.append(' ')
                      }

                      prose.append(line)

                      i++
                  }

                  flushProse()

                  return blocks
              }

              /*
               * Conservative table detector.
               *
               * IMPORTANT:
               *
               * It does not label isolated text as table-like.
               * At least three consecutive lines must contain a
               * recognisable repeated delimiter relationship.
               */

              private fun detectTableLikeRegion(
                  lines: List<String>,
                  start: Int
              ): TableCandidate? {

                  if (start + 2 >= lines.size) {
                      return null
                  }

                  val candidates =
                      mutableListOf<String>()

                  var index = start

                  while (
                      index < lines.size &&
                      candidates.size < 8
                  ) {

                      val line = lines[index]

                      if (!looksLikeTwoUnitRow(line)) {
                          break
                      }

                      candidates.add(line)
                      index++
                  }

                  /*
                   * Three or more stable rows are required.
                   */

                  if (candidates.size < 3) {
                      return null
                  }

                  val text =
                      candidates.joinToString("\n")

                  return TableCandidate(
                      text = text,
                      endIndex = index
                  )
              }

              private fun looksLikeTwoUnitRow(
                  text: String
              ): Boolean {

                  /*
                   * This is intentionally conservative.
                   *
                   * We recognise explicit separators rather than
                   * guessing from arbitrary word spacing.
                   */

                  return text.contains(" — ") ||
                      text.contains(" – ") ||
                      text.contains(" | ") ||
                      text.contains("\t")
              }

              private fun isHeading(
                  text: String
              ): Boolean {

                  val t = text.trim()

                  if (t.length < 3) return false
                  if (t.length > 120) return false

                  if (
                      t.endsWith(".") ||
                      t.endsWith(",") ||
                      t.endsWith(";")
                  ) {
                      return false
                  }

                  val words = t.split(Regex("\\s+"))

                  /*
                   * Very short title-like lines are treated as headings.
                   */

                  return words.size <= 8 &&
                  
