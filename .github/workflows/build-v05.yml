name: Build Smart PDF Reader V0.13

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create V0.13 project
        shell: bash
        run: |
          rm -rf project
          mkdir -p project/app/src/main/java/com/smartpdfreader
          mkdir -p project/app/src/main/res/layout
          mkdir -p project/app/src/main/res/values

          cat > project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SmartPDFReaderV013"
          include(":app")
          EOF

          cat > project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.2' apply false
          }
          EOF

          cat > project/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.smartpdfreader'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.smartpdfreader'
                  minSdk 23
                  targetSdk 35
                  versionCode 13
                  versionName '0.13'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
          }
          EOF

          cat > project/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="PDF → EPUB V0.13"
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > project/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#777777</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#17141c</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>
          </resources>
          EOF

          cat > project/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="10dp">

              <TextView
                  android:id="@+id/title"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="PDF → EPUB\nV0.13 — Region–Relationship Reconstruction Engine"
                  android:textSize="28sp"
                  android:textColor="#EEEEEE"
                  android:paddingBottom="16dp"/>

              <Button
                  android:id="@+id/selectPdf"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="SELECT PDF"/>

              <Button
                  android:id="@+id/analyze"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="10dp"
                  android:text="ANALYZE + RECONSTRUCT"/>

              <Button
                  android:id="@+id/save"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="10dp"
                  android:text="SAVE EPUB"
                  android:enabled="false"/>

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:layout_marginTop="10dp">

                  <TextView
                      android:id="@+id/status"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textSize="16sp"
                      android:textColor="#DDDDDD"/>

              </ScrollView>

          </LinearLayout>
          EOF

          cat > project/app/src/main/java/com/smartpdfreader/MainActivity.java <<'EOF'
          package com.smartpdfreader;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.TextView;

          import java.io.InputStream;
          import java.io.OutputStream;

          public class MainActivity extends Activity {

              private static final int PICK_PDF = 100;
              private static final int CREATE_EPUB = 101;

              private TextView status;
              private Button save;

              private Uri pdfUri;
              private byte[] epubBytes;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  setContentView(R.layout.activity_main);

                  status = findViewById(R.id.status);

                  Button select = findViewById(R.id.selectPdf);
                  Button analyze = findViewById(R.id.analyze);
                  save = findViewById(R.id.save);

                  select.setOnClickListener(v -> {

                      Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      i.setType("application/pdf");
                      i.addCategory(Intent.CATEGORY_OPENABLE);

                      startActivityForResult(i, PICK_PDF);
                  });

                  analyze.setOnClickListener(v -> {

                      if (pdfUri == null) {
                          status.setText("Select a PDF first.");
                          return;
                      }

                      analyze.setEnabled(false);
                      status.setText("Analyzing spatial structure…");

                      new Thread(() -> {

                          try {

                              InputStream in =
                                      getContentResolver()
                                              .openInputStream(pdfUri);

                              ReconstructionEngine.Result r =
                                      ReconstructionEngine.reconstruct(in);

                              in.close();

                              epubBytes = r.epub;

                              runOnUiThread(() -> {
                                  status.setText(r.report);
                                  save.setEnabled(true);
                                  analyze.setEnabled(true);
                              });

                          } catch (Exception e) {

                              runOnUiThread(() -> {

                                  status.setText(
                                      "V0.13 failed safely:\n"
                                      + e.getClass().getSimpleName()
                                      + ": "
                                      + String.valueOf(e.getMessage())
                                  );

                                  analyze.setEnabled(true);
                              });
                          }

                      }).start();
                  });

                  save.setOnClickListener(v -> {

                      if (epubBytes == null)
                          return;

                      Intent i =
                              new Intent(Intent.ACTION_CREATE_DOCUMENT);

                      i.setType("application/epub+zip");

                      i.putExtra(
                              Intent.EXTRA_TITLE,
                              "reconstructed_v0.13.epub");

                      startActivityForResult(i, CREATE_EPUB);
                  });
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data);

                  if (resultCode != RESULT_OK ||
                      data == null)
                      return;

                  if (requestCode == PICK_PDF) {

                      pdfUri = data.getData();

                      status.setText(
                              "PDF selected.\n"
                              + "Ready for V0.13 spatial reconstruction."
                      );

                      save.setEnabled(false);

                  } else if (
                          requestCode == CREATE_EPUB &&
                          epubBytes != null) {

                      try {

                          OutputStream out =
                                  getContentResolver()
                                          .openOutputStream(
                                                  data.getData());

                          out.write(epubBytes);
                          out.close();

                          status.append(
                                  "\n\nEPUB saved successfully."
                          );

                      } catch (Exception e) {

                          status.append(
                                  "\n\nSave failed: "
                                  + e.getMessage()
                          );
                      }
                  }
              }
          }
          EOF

          cat > project/app/src/main/java/com/smartpdfreader/ReconstructionEngine.java <<'EOF'
