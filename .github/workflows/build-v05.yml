name: Build PDF to EPUB V0.5

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V0.5 project
        run: |
          rm -rf project
          mkdir -p project

          unzip -q PdfToEpub_V0.5_CLEAN.zip -d project

          echo "Project files:"
          find project -maxdepth 3 -type f | sort

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK=$(find project -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p output
          cp "$APK" output/PdfToEpub_V0.5-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PdfToEpub_V0.5-debug
          path: output/PdfToEpub_V0.5-debug.apk
