name: Build Android APK V0.13

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 17
      # ==================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==================================================
      # 3. INSTALL GRADLE 8.9
      # ==================================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ==================================================
      # 4. LOCATE EXACT V0.13 ZIP
      # ==================================================
      - name: Locate V0.13 project ZIP
        shell: bash
        run: |
          set -e

          ZIP="PdfToEpub_V0.13_SPATIAL_RELATIONSHIP_REBUILD.zip"

          echo "Looking for:"
          echo "$ZIP"
          echo

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: V0.13 ZIP not found."
            echo
            echo "ZIP files in repository:"
            find . -maxdepth 1 -type f -iname "*.zip" -print | sort
            exit 1
          fi

          echo "V0.13 ZIP FOUND:"
          ls -lh "$ZIP"


      # ==================================================
      # 5. EXTRACT V0.13
      # ==================================================
      - name: Extract V0.13 project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q \
            "PdfToEpub_V0.13_SPATIAL_RELATIONSHIP_REBUILD.zip" \
            -d project

          echo "Extraction completed."
          echo
          echo "Project files:"
          find project -maxdepth 3 -type f | sort


      # ==================================================
      # 6. LOCATE ANDROID PROJECT
      # ==================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No settings.gradle found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt


      # ==================================================
      # 7. VERIFY ANDROID PROJECT
      # ==================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "Checking project:"
          echo "$PROJECT_DIR"
          echo

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: Root build.gradle missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle missing."
            exit 1
          fi

          echo "ANDROID PROJECT VERIFICATION PASSED."


      # ==================================================
      # 8. SHOW GRADLE VERSION
      # ==================================================
      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          gradle --version


      # ==================================================
      # 9. BUILD DEBUG APK
      # ==================================================
      - name: Build debug APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          gradle clean assembleDebug --stacktrace


      # ==================================================
      # 10. FIND APK
      # ==================================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "Searching for APK..."
          echo

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*-debug.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo
            echo "ERROR: No debug APK generated."
            exit 1
          fi

          echo
          echo "APK FOUND:"
          ls -lh "$APK"

          cp "$APK" "Smart-PDF-Reader-V0.13-debug.apk"


      # ==================================================
      # 11. UPLOAD APK
      # ==================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-PDF-Reader-V0.13-debug
          path: Smart-PDF-Reader-V0.13-debug.apk
          if-no-files-found: error
