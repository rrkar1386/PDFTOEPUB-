name: Build Android APK V0.13

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. JAVA 17
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # --------------------------------------------------
      # 3. SELECT ONLY THE V0.13 PROJECT ZIP
      # --------------------------------------------------
      - name: Locate V0.13 project ZIP
        shell: bash
        run: |
          set -e

          ZIP="PdfToEpub_V0.13_SPATIAL_RELATIONSHIP_REBUILD.zip"

          echo "Looking for:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Required V0.13 ZIP was not found."
            echo
            echo "ZIP files currently in repository:"
            find . -maxdepth 1 -type f -iname "*.zip" -print | sort
            exit 1
          fi

          echo "Found V0.13 ZIP:"
          ls -lh "$ZIP"


      # --------------------------------------------------
      # 4. EXTRACT V0.13 PROJECT
      # --------------------------------------------------
      - name: Extract V0.13 project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q \
            "PdfToEpub_V0.13_SPATIAL_RELATIONSHIP_REBUILD.zip" \
            -d project

          echo "Extraction completed."

          echo "Top-level extracted contents:"
          find project -maxdepth 2 -type f | sort | head -100


      # --------------------------------------------------
      # 5. LOCATE ACTUAL GRADLE PROJECT
      # --------------------------------------------------
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found."
            echo
            echo "Extracted files:"
            find project -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt


      # --------------------------------------------------
      # 6. VERIFY PROJECT STRUCTURE
      # --------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "Checking:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found."
            echo
            echo "Project contents:"
            find "$PROJECT_DIR" -maxdepth 3 -type f | sort
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Android app module 'app' not found."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Android project verification PASSED."


      # --------------------------------------------------
      # 7. SHOW GRADLE VERSION
      # --------------------------------------------------
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          ./gradlew --version


      # --------------------------------------------------
      # 8. BUILD DEBUG APK
      # --------------------------------------------------
      - name: Build debug APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          ./gradlew clean assembleDebug --stacktrace


      # --------------------------------------------------
      # 9. FIND APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*-debug.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not produced."
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          cp "$APK" "Smart-PDF-Reader-V0.13-debug.apk"


      # --------------------------------------------------
      # 10. UPLOAD APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-PDF-Reader-V0.13-debug
          path: Smart-PDF-Reader-V0.13-debug.apk
          if-no-files-found: error
