name: Build Android APK V0.13

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT REPOSITORY
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 17
      # ==================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==================================================
      # 3. IDENTIFY THE EXACT V0.13 ZIP
      # ==================================================
      - name: Locate V0.13 project ZIP
        shell: bash
        run: |
          set -e

          ZIP="PdfToEpub_V0.13_SPATIAL_RELATIONSHIP_REBUILD.zip"

          echo "Looking for V0.13 project:"
          echo "$ZIP"
          echo

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: V0.13 ZIP was not found."
            echo
            echo "ZIP files present in repository root:"
            find . -maxdepth 1 -type f -iname "*.zip" -print | sort
            exit 1
          fi

          echo "V0.13 ZIP FOUND:"
          ls -lh "$ZIP"


      # ==================================================
      # 4. EXTRACT ONLY V0.13
      # ==================================================
      - name: Extract V0.13 project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q \
            "PdfToEpub_V0.13_SPATIAL_RELATIONSHIP_REBUILD.zip" \
            -d project

          echo "Extraction completed."
          echo
          echo "Extracted structure:"
          find project -maxdepth 3 -type f | sort | head -150


      # ==================================================
      # 5. LOCATE ACTUAL GRADLE PROJECT
      # ==================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No Gradle settings file found."
            echo
            echo "Extracted project files:"
            find project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt


      # ==================================================
      # 6. VERIFY PROJECT BEFORE BUILD
      # ==================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "Checking project:"
          echo "$PROJECT_DIR"
          echo

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found."
            echo
            echo "Project contents:"
            find "$PROJECT_DIR" -maxdepth 3 -type f | sort
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app module not found."
            echo
            echo "Project directories:"
            find "$PROJECT_DIR" -maxdepth 2 -type d | sort
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "ANDROID PROJECT VERIFICATION PASSED."


      # ==================================================
      # 7. VERIFY PROJECT'S OWN GRADLE WRAPPER
      # ==================================================
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          echo "Gradle wrapper:"
          ./gradlew --version


      # ==================================================
      # 8. BUILD DEBUG APK
      # ==================================================
      - name: Build debug APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          ./gradlew clean assembleDebug --stacktrace


      # ==================================================
      # 9. FIND THE GENERATED APK
      # ==================================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "Searching for generated APK..."
          echo

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*-debug.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo
            echo "ERROR: No debug APK was generated."
            exit 1
          fi

          echo
          echo "DEBUG APK FOUND:"
          ls -lh "$APK"

          cp "$APK" "Smart-PDF-Reader-V0.13-debug.apk"


      # ==================================================
      # 10. UPLOAD APK AS GITHUB ARTIFACT
      # ==================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-PDF-Reader-V0.13-debug
          path: Smart-PDF-Reader-V0.13-debug.apk
          if-no-files-found: error
