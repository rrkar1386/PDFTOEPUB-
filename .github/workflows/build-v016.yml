name: Build V0.16 APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-v016.yml'
      - 'PdfToEpub_V0.15_CONTEXTUAL_SPATIAL_RECONSTRUCTION.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V0.15 baseline
        run: |
          set -e
          test -f PdfToEpub_V0.15_CONTEXTUAL_SPATIAL_RECONSTRUCTION.zip
          rm -rf v016
          mkdir v016
          unzip -q PdfToEpub_V0.15_CONTEXTUAL_SPATIAL_RECONSTRUCTION.zip -d v016
          test -f v016/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt
          test -f v016/app/build.gradle
          test -f v016/settings.gradle

      - name: Apply V0.16 source
        run: |
          set -e
          cp MainActivity_V0.16.kt v016/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt
          cp app-build-v016.gradle v016/app/build.gradle

      - name: Verify V0.16 source
        run: |
          set -e
          grep -q 'V0.16' v016/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt
          grep -q "versionName '0.16'" v016/app/build.gradle
          grep -q "versionCode 16" v016/app/build.gradle
          grep -q 'repairContextualStructures' v016/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt

      - name: Build V0.16 APK
        working-directory: v016
        run: gradle clean assembleDebug --no-daemon

      - name: Verify APK
        run: |
          set -e
          test -s v016/app/build/outputs/apk/debug/app-debug.apk
          ls -lh v016/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload V0.16 APK
        uses: actions/upload-artifact@v4
        with:
          name: PdfToEpub_V0.16_debug
          path: v016/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
