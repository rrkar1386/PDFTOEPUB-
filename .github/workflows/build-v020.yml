name: Build V0.20 APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-v020.yml'
      - 'MainActivity_V0.20.kt'
      - 'app-build-v020.gradle'
      - 'PdfToEpub_V0.15_CONTEXTUAL_SPATIAL_RECONSTRUCTION.zip'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify V0.20 inputs
        run: |
          set -e

          test -s MainActivity_V0.20.kt
          test -s app-build-v020.gradle
          test -s PdfToEpub_V0.15_CONTEXTUAL_SPATIAL_RECONSTRUCTION.zip

          grep -q 'V0.20' MainActivity_V0.20.kt
          grep -q "versionCode 20" app-build-v020.gradle
          grep -q "versionName '0.20'" app-build-v020.gradle

          grep -q 'detectIntentionalWhitespace' MainActivity_V0.20.kt
          grep -q 'detectGlossaryMode' MainActivity_V0.20.kt
          grep -q 'TABLE_CANDIDATES' MainActivity_V0.20.kt
          grep -q 'pageNumber: Int = 0' MainActivity_V0.20.kt

          grep -q 'AnalysisOutput' MainActivity_V0.20.kt
          grep -q 'collectFigurePreviewSpecs' MainActivity_V0.20.kt
          grep -q 'showFigurePreviews' MainActivity_V0.20.kt
          grep -q 'figureContainer' MainActivity_V0.20.kt

          echo "V0.20 inputs verified."

      - name: Extract V0.18 known-good baseline
        run: |
          set -e

          rm -rf v020
          mkdir v020

          unzip -q \
            PdfToEpub_V0.15_CONTEXTUAL_SPATIAL_RECONSTRUCTION.zip \
            -d v020

          test -f v020/settings.gradle
          test -f v020/build.gradle
          test -f v020/app/build.gradle
          test -f v020/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt

          echo "Known-good V0.18 baseline extracted successfully."

      - name: Apply V0.20 MainActivity
        run: |
          set -e

          cp MainActivity_V0.20.kt \
            v020/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt

          echo "V0.20 MainActivity applied."

      - name: Apply V0.20 Gradle
        run: |
          set -e

          cp app-build-v020.gradle \
            v020/app/build.gradle

          echo "V0.20 Gradle applied."

      - name: Verify applied V0.20 project
        run: |
          set -e

          test -s \
            v020/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt

          test -s v020/app/build.gradle

          grep -q 'V0.20' \
            v020/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt

          grep -q "versionCode 20" \
            v020/app/build.gradle

          grep -q "versionName '0.20'" \
            v020/app/build.gradle

          grep -q 'detectIntentionalWhitespace' \
            v020/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt

          grep -q 'detectGlossaryMode' \
            v020/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt

          grep -q 'TABLE_CANDIDATES' \
            v020/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt

          grep -q 'AnalysisOutput' \
            v020/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt

          grep -q 'showFigurePreviews' \
            v020/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt

          echo "Applied V0.20 project verified."

      - name: Build V0.20 debug APK
        working-directory: v020
        run: |
          set -e

          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Verify actual APK
        run: |
          set -e

          APK="v020/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          file "$APK"

          unzip -tq "$APK" >/dev/null

          ls -lh "$APK"

          echo "ACTUAL V0.20 APK BUILD VERIFIED."

      - name: Upload V0.20 APK
        uses: actions/upload-artifact@v4
        with:
          name: PdfToEpub_V0.20_debug
          path: v020/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
