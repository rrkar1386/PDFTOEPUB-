name: Build V0.20 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v020.yml'
      - 'MainActivity_V0.20.kt'
      - 'app-build-v020.gradle'
      - 'v019/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify V0.20 inputs
        shell: bash
        run: |
          set -e
          test -f MainActivity_V0.20.kt
          test -f app-build-v020.gradle
          test -d v019/app
          echo "V0.20 inputs verified."

      - name: Create V0.20 from known-good V0.19 baseline
        shell: bash
        run: |
          set -e
          rm -rf v020
          cp -R v019 v020

          mkdir -p v020/app/src/main/java/com/pdf_to_epub/v06

          cp MainActivity_V0.20.kt \
            v020/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt

          cp app-build-v020.gradle v020/app/build.gradle

          echo "V0.20 source and Gradle applied."

      - name: Verify applied project
        shell: bash
        run: |
          set -e
          test -f v020/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt
          test -f v020/app/build.gradle

          grep -q "versionCode 20" v020/app/build.gradle
          grep -q "versionName '0.20'" v020/app/build.gradle
          grep -q "data class AnalysisOutput" \
            v020/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt
          grep -q "collectFigurePreviewSpecs" \
            v020/app/src/main/java/com/pdf_to_epub/v06/MainActivity.kt

          echo "Applied V0.20 project verified."

      - name: Build V0.20 debug APK
        shell: bash
        run: |
          set -e
          gradle -p v020 clean assembleDebug --stacktrace

      - name: Verify actual APK
        shell: bash
        run: |
          set -e

          APK="v020/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK exists:"
          ls -lh "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20

      - name: Upload V0.20 APK
        uses: actions/upload-artifact@v4
        with:
          name: PDFTOEPUB-V0.20-debug
          path: v020/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
